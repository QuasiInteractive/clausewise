services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: clausewise
      POSTGRES_PASSWORD: clausewise
      POSTGRES_DB: clausewise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

volumes:
  pgdata:
