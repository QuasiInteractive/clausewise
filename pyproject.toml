[project]
name = "clausewise"
version = "0.1.0"
description = "Reads a Queensland residential lease and checks each clause against the official tenancy rules, with citations."
readme = "README.md"
authors = [
    { name = "Nicolas Balkhausen", email = "lucidcubex@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
clausewise = "clausewise:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
